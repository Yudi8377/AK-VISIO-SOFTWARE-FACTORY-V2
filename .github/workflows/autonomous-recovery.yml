name: Autonomous Recovery Scheduler

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run trusted autonomous recovery gate
        env:
          RECOVERY_URL: ${{ secrets.AUTONOMOUS_RECOVERY_URL }}
          RECOVERY_SECRET: ${{ secrets.AUTONOMOUS_RECOVERY_SECRET }}
          OWNER_ID: ${{ secrets.AUTONOMOUS_RECOVERY_OWNER_ID }}
          CURRENT_DEPLOYMENT_ID: ${{ secrets.AUTONOMOUS_RECOVERY_CURRENT_DEPLOYMENT_ID }}
          TARGET_DEPLOYMENT_ID: ${{ secrets.AUTONOMOUS_RECOVERY_TARGET_DEPLOYMENT_ID }}
          ORGANIZATION_ID: ${{ secrets.AUTONOMOUS_RECOVERY_ORGANIZATION_ID }}
          ENVIRONMENT: ${{ secrets.AUTONOMOUS_RECOVERY_ENVIRONMENT }}
        run: |
          set -euo pipefail
          test -n "$RECOVERY_URL"
          test -n "$RECOVERY_SECRET"
          test -n "$OWNER_ID"
          test -n "$CURRENT_DEPLOYMENT_ID"
          test -n "$TARGET_DEPLOYMENT_ID"
          test -n "$ORGANIZATION_ID"
          test -n "$ENVIRONMENT"
          curl --fail --silent --show-error --location --max-time 45             -X POST "$RECOVERY_URL/api/factory/recover"             -H 'content-type: application/json'             -H "x-autonomous-recovery-secret: $RECOVERY_SECRET"             --data "{"ownerId":"$OWNER_ID","currentDeploymentId":"$CURRENT_DEPLOYMENT_ID","targetDeploymentId":"$TARGET_DEPLOYMENT_ID","organizationId":"$ORGANIZATION_ID","environment":"$ENVIRONMENT"}"
