name: Production Check

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: production-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and production smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run Digital Presence safety contracts
        run: npm run test:safety

      - name: Build production application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-build-key

      - name: Verify production container definition
        run: |
          test -f Dockerfile
          test -f .dockerignore

      - name: Smoke test production health endpoint
        run: |
          set -euo pipefail
          url="https://ak-visio-software-factory-v2.dwahyudi8377.workers.dev/api/health"
          body="$(curl --fail --silent --show-error --location --max-time 30 "$url")"
          echo "$body"
          echo "$body" | grep -F '"status":"ok"'
          echo "$body" | grep -F '"service":"ak-visio-software-factory-v2"'

      - name: Smoke test Digital Presence readiness endpoint
        run: |
          set -euo pipefail
          url="https://ak-visio-software-factory-v2.dwahyudi8377.workers.dev/api/digital-presence/status"
          body="$(curl --fail --silent --show-error --location --max-time 30 "$url")"
          echo "$body"
          echo "$body" | grep -F '"status":"ok"'
          echo "$body" | grep -F '"internalGeneration":true'
          echo "$body" | grep -F '"liveSerpResearch":false'
          echo "$body" | grep -F '"externalPublishing":false'
          echo "$body" | grep -F '"accountCreation":"MANUAL"'
          echo "$body" | grep -F '"externalPublishing":"SEMI_AUTO"'
