name: AK VISIO ENGINEER Phase 1

on:
  push:
    paths:
      - "AK-VISIO-ENGINEER/**"
  pull_request:
    paths:
      - "AK-VISIO-ENGINEER/**"

jobs:
  foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AK-VISIO-ENGINEER
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run selftest
      - run: npm run typecheck
