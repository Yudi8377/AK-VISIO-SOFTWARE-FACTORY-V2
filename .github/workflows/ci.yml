name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run Digital Presence safety contracts
        run: npm run test:safety

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-build-key

      - name: Build production Docker image
        run: docker build --tag ak-visio-software-factory-v2:ci .

      - name: Smoke test production health endpoint
        run: |
          set -euo pipefail
          url="https://ak-visio-software-factory-v2.dwahyudi8377.workers.dev/api/health"
          body="$(curl --fail --silent --show-error --location --max-time 30 "$url")"
          echo "$body"
          echo "$body" | grep -F '"status":"ok"'
          echo "$body" | grep -F '"service":"ak-visio-software-factory-v2"'
