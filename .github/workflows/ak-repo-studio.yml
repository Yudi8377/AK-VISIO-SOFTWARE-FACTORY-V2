name: AK Repo Studio
on:
  push:
    paths:
      - "AK-VISIO-ENGINEER/apps/repo-studio/**"
      - ".github/workflows/ak-repo-studio.yml"
    tags:
      - "repo-studio-v*"
  pull_request:
    paths:
      - "AK-VISIO-ENGINEER/apps/repo-studio/**"
      - ".github/workflows/ak-repo-studio.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AK-VISIO-ENGINEER/apps/repo-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
  package:
    if: startsWith(github.ref, 'refs/tags/repo-studio-v') || github.ref == 'refs/heads/main'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        shell: pwsh
        run: |
          $src="AK-VISIO-ENGINEER/apps/repo-studio"
          $out="AK-Repo-Studio-${{ github.ref_name }}-Windows.zip"
          Compress-Archive -Path "$src/*" -DestinationPath $out -Force
      - uses: actions/upload-artifact@v4
        with:
          name: AK-Repo-Studio-Windows
          path: "*.zip"
